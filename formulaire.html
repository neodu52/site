<div class="container py-5" style="margin-top: 20px;">
  <div class="row justify-content-center">
    <div class="col-md-8">

      <div class="card shadow-sm p-4">
        <h2 class="fw-bold text-center mb-4">Formulaire de contact</h2>

        <form action="send.php" method="POST">

          <div class="mb-3">
            <label class="form-label">Nom / Prénom ou Société / Établissement</label>
            <input type="text" name="nom" class="form-control" placeholder="Ex: John Dupont ou TechLab Inc." required>
          </div>

          <div class="mb-3">
            <label class="form-label">Adresse Email</label>
            <input type="email" name="email" class="form-control" placeholder="exemple@mail.com" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Pays</label>
            <select name="pays" class="form-select" required>
              <option value="">Choisissez votre pays</option>
              <option>France</option>
              <option>Belgique</option>
              <option>Canada</option>
              <option>Suisse</option>
              <option>Autre</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Votre demande</label>
            <textarea name="message" class="form-control" rows="5" placeholder="Écrivez ici votre message..." required></textarea>
          </div>

          <div class="text-center">
            <button type="submit" class="btn btn-primary px-5">Envoyer</button>
          </div>

        </form>
      </div>

    </div>
  </div>
